<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="left">
            <h3>Gems: <span id="score">0</span></h3>
            <div id="clicker" onclick="addClick()"></div>
        </div>
        <div class="right">
            <div id="upgrade1" onclick="upgrade1F()">Upgrade click: <span id="upgrade1CostHtml">50</span></div>
            <div id="upgrade2" onclick="upgrade2F()">Upgrade click x2: <span id="upgrade2CostHtml">200</span></div>
            <div id="upgrade3" onclick="upgrade3F()">Upgrade auto clicker: <span id="upgrade3CostHtml">400</span></div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
